<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Cutter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="startScreen">
        <h1>🍉Fruit Cutter</h1>
        <button id="startButton">START GAME</button>
    </div>


    <div id="levelScreen">
        <h1>SELECT LEVEL</h1>

        <div id="levelContainer">

            <button class="levelButton" id="level1Button">
                🟢 LEVEL 1
            </button>

            <button class="levelButton locked" id="level2Button">
                🔒 LEVEL 2
            </button>

            <button class="levelButton locked" id="level3Button">
                🔒 LEVEL 3
            </button>

        </div>

        <button id="homeButton">🏠 HOME</button>
    </div>



    <div id="gameScreen">
        <div id="gameInfo">
            <span>Score:<b id="score">0</b></span>
            <span>Lives:<b id="lives">❤️❤️❤️</b></span>
            <span>Time:<b id="timer">02:00</b></span>
            <button id="quitButton">QUIT</button>
        </div>
        <div id="gameArea"></div>
    </div>

    <div id="gameOverScreen">
        <h1>GAME OVER</h1>
        <p>Final Score:<b id="finalScore">0</b></p>
        <button id="playAgainButton">PLAY AGAIN</button>
    </div>
    <div id="timeUpScreen">
        <h1>⏰ Time's Up!</h1>
        <p>Your Time Is Over!</p>
        <p>Final Score: <span id="timeUpScore">0</span></p>

        <button id="timeUpPlayAgainButton">Play Again</button>
        <button id="timeUpQuitButton">Quit</button>
    </div>
    <div id="levelCompleteScreen">
        <h1>🎉 LEVEL COMPLETE!</h1>

        <p>
            Score:
            <b id="levelFinalScore">0</b>
        </p>

        <button id="nextLevelButton">NEXT LEVEL</button>
        <button id="completeHomeButton">🏠 HOME</button>
    </div>
    <!-- Final Congratulations Screen -->
    <div id="finalCongratulationsScreen" style="display: none;">
        <h1>🎉 Congratulations! 🎉</h1>
        <p>You completed all 3 levels!</p>
        <p>🏆 Final Score: <span id="finalCongratulationsScore">0</span></p>

        <button id="finalPlayAgainButton">Play Again</button>
        <button id="finalLevelsButton">Back to Levels</button>
    </div>

    <button id="fabButton" title="How to Play">?</button>
    <script src="script.js"></script>
</body>

</html>
